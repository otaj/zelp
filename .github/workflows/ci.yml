name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v9

      - name: Lint shell scripts
        # Keep shellcheck-py pin in sync with .pre-commit-config.yaml.
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Analyze Kotlin
        run: |
          set -euo pipefail
          # detekt CLI — avoids booting AGP / compiling Flutter's Gradle
          # includeBuild / resolving the Android dependency graph (~4+ min).
          ./scripts/analyze_kotlin.sh

      - name: Test
        run: flutter test
