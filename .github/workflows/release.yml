name: Release

on:
  push:
    branches: [master]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          version="${version%%+*}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag '$TAG_NAME' does not look like a semver version (e.g. v1.2.3)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          build_number=$((major * 10000 + minor * 100 + patch))
          echo "VERSION_NAME=${version}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${build_number}" >> "$GITHUB_ENV"
          echo "Set version to ${version}+${build_number}"

      - name: Set version from git
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # AUR-style pkgver: <tag>.r<commits>.g<hash>
          # https://wiki.archlinux.org/title/VCS_package_guidelines#Git
          version=$(
            set -o pipefail
            git describe --long --tags --abbrev=7 2>/dev/null \
              | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' \
              || printf 'r%s.%s' "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
          )
          build_number=$(git rev-list --count HEAD)
          echo "VERSION_NAME=${version}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${build_number}" >> "$GITHUB_ENV"
          echo "Set version to ${version}+${build_number}"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > zelp-release.jks
          printf '%s\n' \
            "storePassword=${STORE_PASSWORD}" \
            "keyPassword=${KEY_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=../../zelp-release.jks" \
            > android/key.properties

      - name: Build release APKs
        run: flutter build apk --release --flavor prod --split-per-abi --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"

      - name: Rename APKs for release
        run: |
          set -euo pipefail
          app_name=$(awk '/^name:/ { print $2; exit }' pubspec.yaml)
          mkdir -p release-apks
          shopt -s nullglob
          # Flutter names flavored split APKs app-<abi>-<flavor>-release.apk
          apks=(build/app/outputs/flutter-apk/app-*-prod-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No split APKs found under build/app/outputs/flutter-apk/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            # app-<abi>-prod-release.apk → <abi>
            abi=${base#app-}
            abi=${abi%-prod-release.apk}
            dest="release-apks/${app_name}-${VERSION_NAME}-${abi}.apk"
            cp "$apk" "$dest"
            echo "Prepared $dest"
          done

      - name: Ensure no proprietary Google libraries
        run: ./scripts/check_no_google_libs.sh release-apks/*.apk

      - name: Upload APKs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload armeabi-v7a APK
        if: github.event_name == 'push'
        uses: ./.github/actions/upload-apk
        with:
          version: ${{ env.VERSION_NAME }}
          abi: armeabi-v7a

      - name: Upload arm64-v8a APK
        if: github.event_name == 'push'
        uses: ./.github/actions/upload-apk
        with:
          version: ${{ env.VERSION_NAME }}
          abi: arm64-v8a

      - name: Upload x86_64 APK
        if: github.event_name == 'push'
        uses: ./.github/actions/upload-apk
        with:
          version: ${{ env.VERSION_NAME }}
          abi: x86_64
