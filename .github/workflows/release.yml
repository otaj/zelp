name: Release

on:
  release:
    types: [published]

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set version from release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          version="${version%%+*}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag '$TAG_NAME' does not look like a semver version (e.g. v1.2.3)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          build_number=$((major * 10000 + minor * 100 + patch))
          full_version="${version}+${build_number}"
          sed -i "s/^version: .*/version: ${full_version}/" pubspec.yaml
          echo "Set pubspec version to ${full_version}"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > zelp-release.jks
          printf '%s\n' \
            "storePassword=${STORE_PASSWORD}" \
            "keyPassword=${KEY_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=../../zelp-release.jks" \
            > android/key.properties

      - name: Build release APKs
        run: flutter build apk --release --flavor prod --split-per-abi

      - name: Rename APKs for release
        run: |
          set -euo pipefail
          app_name=$(awk '/^name:/ { print $2; exit }' pubspec.yaml)
          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml | cut -d+ -f1)
          mkdir -p release-apks
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-prod-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No split APKs found under build/app/outputs/flutter-apk/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            # app-prod-<abi>-release.apk → <abi>
            abi=${base#app-prod-}
            abi=${abi%-release.apk}
            dest="release-apks/${app_name}-${version}-${abi}.apk"
            cp "$apk" "$dest"
            echo "Prepared $dest"
          done

      - name: Ensure no proprietary Google libraries
        run: ./scripts/check_no_google_libs.sh release-apks/*.apk

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
