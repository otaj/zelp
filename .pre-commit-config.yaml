# Install both hook stages:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # All fvm entries go through scripts/run_fvm.sh so GIT_DIR from
      # pre-commit/worktrees cannot poison the shared Flutter SDK git metadata.
      - id: dart-format
        name: fvm dart format
        entry: bash scripts/run_fvm.sh dart format --set-exit-if-changed
        language: system
        types: [dart]
        stages: [pre-commit]
      - id: flutter-analyze
        name: fvm flutter analyze
        entry: bash scripts/run_fvm.sh flutter analyze --fatal-warnings --fatal-infos
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: kotlin-analyze
        name: android analyze (Kotlin)
        entry: bash scripts/analyze_kotlin.sh
        language: system
        pass_filenames: false
        files: 'android/.*\.(kt|kts)$|android/config/detekt/.*'
        stages: [pre-commit]
      - id: flutter-pub-outdated
        name: fvm flutter pub outdated (direct/dev)
        entry: python3 scripts/check_pub_outdated.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
